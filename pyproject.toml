[project]
name = "rot13-cipher"
version = "1.0.0"
description = "Encrypt and decrypt text with the ROT-13 cipher — CLI + Tkinter GUI."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.scripts]
rot13 = "rot13.cli:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["rot13"]
